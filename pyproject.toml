# Repository tooling configuration. The plugin itself (SemanticPluginSearch/)
# is a QGIS plugin, not a pip package. Naming follows req-camelcase-naming:
# UpperCamelCase classes and modules, Qt style camelCase methods.
# @impl 0f87-6ae3-6986-14e6

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["Test*.py", "test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["N802", "N803", "N806", "UP007"]

[tool.ruff.lint.per-file-ignores]
# The fixture catalogue template embeds long XML lines.
"tests/conftest.py" = ["E501"]
