name: BuildEmbeddings

# Fetch the plugin metadata and readmes, compute the embeddings, store them
# on the `embeddings` branch. Nothing else: no QGIS, no release API, and the
# model is converted only once, when the branch has none.

on:
  schedule:
    # One universe per day keeps each run small. Monday QGIS 3, Tuesday QGIS 4.
    - cron: "0 3 * * 1" # Monday 03:00 UTC - QGIS 3.44
    - cron: "0 3 * * 2" # Tuesday 03:00 UTC - QGIS 4.2
  workflow_dispatch: # manual runs build both universes
    inputs:
      refresh_readmes:
        description: "Fetch every readme again instead of reusing unchanged ones"
        type: boolean
        default: false

concurrency:
  group: build-embeddings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and store the embeddings
    runs-on: ubuntu-latest
    # A healthy run takes minutes; a hang must fail fast.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ github.token }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      REFRESH_READMES: ${{ inputs.refresh_readmes && '--refresh' || '' }}
    steps:
      # Action SHAs pinned to the commits their tags pointed at; bump deliberately.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy

      - name: Check out the stored embeddings
        run: |
          mkdir -p store
          # The full ref name: a bare "embeddings" also matches the tag of the
          # retired embeddings release, which points at a source commit.
          if git fetch --depth 1 origin refs/heads/embeddings; then
            git archive FETCH_HEAD | tar -x -C store
          fi
          ls -l store

      - name: Convert the model (only when the stored one is not this model as int8)
        env:
          MODEL_ID: static-similarity-mrl-multilingual-v1-256
        run: |
          STORED=$(ls store/EmbeddingModel.*.npz 2>/dev/null | head -1)
          if [ -n "$STORED" ] && python -c "import json,os,sys,numpy as np; m=json.loads(str(np.load(sys.argv[1])['meta'])); sys.exit(not (m.get('dtype') == 'int8' and m.get('model_id') == os.environ['MODEL_ID']))" "$STORED"; then
            echo "$MODEL_ID already stored as int8: nothing to download."
            exit 0
          fi
          # sentence-transformers/static-similarity-mrl-multilingual-v1:
          # Apache-2.0, multilingual static embeddings over the uncased
          # multilingual BERT WordPiece vocabulary, Matryoshka trained, kept
          # at 256 dimensions. Revision and checksums are pinned.
          REPO=sentence-transformers/static-similarity-mrl-multilingual-v1
          REV=b68f4122911bcffcd6e1f695f2d99cd6788972d8
          mkdir -p build/model
          curl -fL --retry 3 -o build/model/model.safetensors \
            "https://huggingface.co/$REPO/resolve/$REV/0_StaticEmbedding/model.safetensors"
          echo "8245ab78ee71dded845a82d2270fcb9e785b29dad0e1619f69d5390c47d9ba00  build/model/model.safetensors" | sha256sum --check -
          curl -fL --retry 3 -o build/model/tokenizer.json \
            "https://huggingface.co/$REPO/resolve/$REV/0_StaticEmbedding/tokenizer.json"
          echo "11aaf894a4ccf3d95e8830e27c0f8152791fbbff2b988e29a265580b86edd216  build/model/tokenizer.json" | sha256sum --check -
          python pipeline/ConvertStaticModel.py \
            --model-dir build/model \
            --tensor-name embedding.weight \
            --dims 256 \
            --model-id "$MODEL_ID" \
            --source-model "$REPO" \
            --license-note "Apache-2.0 (sentence-transformers/static-similarity-mrl-multilingual-v1); commercial use allowed" \
            --dtype int8 \
            --output build/EmbeddingModel.npz

      - name: Fetch, embed and store
        run: |
          case "$EVENT_SCHEDULE" in
            "0 3 * * 1") VERSIONS="3.44" ;;
            "0 3 * * 2") VERSIONS="4.2" ;;
            *) VERSIONS="3.44 4.2" ;;
          esac
          # A new model changes the vector space: every universe is rebuilt
          # in the same run, so no database built with the old model remains.
          if [ -f build/EmbeddingModel.npz ]; then VERSIONS="3.44 4.2"; fi
          if [ -f build/EmbeddingModel.npz ]; then
            MODEL=build/EmbeddingModel.npz
            MODEL_ARG="--model $MODEL"
          else
            MODEL=$(ls store/EmbeddingModel.*.npz)
            MODEL_ARG=""
          fi
          DATABASES=""
          for v in $VERSIONS; do
            u=${v%%.*}
            # Only new or updated plugins are fetched; the cache lives on the branch.
            python pipeline/FetchCatalogue.py "$v" --output-dir build --connections 12 \
              --readme-cache "store/Readmes-$u.json.gz" $REFRESH_READMES
            python pipeline/BuildEmbeddings.py \
              --catalogue "build/plugins-$v.xml" \
              --readmes "build/plugins-$v" \
              --readme-urls "build/readme-urls-$v.json" \
              --model "$MODEL" \
              --universe "$u" \
              --output "build/Embeddings-$u.sqlite"
            DATABASES="$DATABASES --database $u=build/Embeddings-$u.sqlite"
          done
          python pipeline/StoreEmbeddings.py --store store $DATABASES $MODEL_ARG \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/embeddings"

      - name: Push the embeddings branch
        run: |
          cp pipeline/EmbeddingsBranchReadme.md store/README.md
          cd store
          # A single commit, force pushed: the branch never accumulates history.
          # Only the data files are committed, whatever else the directory holds.
          git init -q -b embeddings
          git add -- index.json README.md EmbeddingModel.*.npz Embeddings-*.sqlite Readmes-*.json.gz
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Embeddings $(date -u +%Y-%m-%dT%H:%MZ)"
          git status --short
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/embeddings
