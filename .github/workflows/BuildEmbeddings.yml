name: BuildEmbeddings

# Fetch the plugin metadata and readmes, compute the embeddings, store them
# on the `embeddings` branch. Nothing else: no QGIS, no release API, and the
# model is converted only once, when the branch has none.

on:
  schedule:
    # One universe per day keeps each run small. Monday QGIS 3, Tuesday QGIS 4.
    - cron: "0 3 * * 1" # Monday 03:00 UTC - QGIS 3.44
    - cron: "0 3 * * 2" # Tuesday 03:00 UTC - QGIS 4.2
  workflow_dispatch: # manual runs build both universes

concurrency:
  group: build-embeddings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and store the embeddings
    runs-on: ubuntu-latest
    # A healthy run takes minutes; a hang must fail fast.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ github.token }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      # Action SHAs pinned to the commits their tags pointed at; bump deliberately.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy

      - name: Check out the stored embeddings
        run: |
          mkdir -p store
          if git fetch --depth 1 origin embeddings; then
            git archive FETCH_HEAD | tar -x -C store
          fi
          ls -l store

      - name: Convert the model (only when none is stored)
        run: |
          if ls store/EmbeddingModel.*.npz >/dev/null 2>&1; then
            echo "Model already stored: nothing to download."
            exit 0
          fi
          # minishlab/potion-base-8M: MIT licensed, distilled from the
          # Apache-2.0 all-MiniLM-L6-v2. Revision and checksum are pinned.
          REV=bf8b056651a2c21b8d2565580b8569da283cab23
          mkdir -p build/model
          curl -fL --retry 3 -o build/model/model.safetensors \
            "https://huggingface.co/minishlab/potion-base-8M/resolve/$REV/model.safetensors"
          echo "f65d0f325faadc1e121c319e2faa41170d3fa07d8c89abd48ca5358d9a223de2  build/model/model.safetensors" | sha256sum --check -
          curl -fL --retry 3 -o build/model/tokenizer.json \
            "https://huggingface.co/minishlab/potion-base-8M/resolve/$REV/tokenizer.json"
          python pipeline/ConvertStaticModel.py \
            --model-dir build/model \
            --model-id static-potion-base-8M \
            --source-model "minishlab/potion-base-8M" \
            --license-note "MIT (potion-base-8M), distilled from all-MiniLM-L6-v2 (Apache-2.0); commercial use allowed" \
            --output build/EmbeddingModel.npz

      - name: Fetch, embed and store
        run: |
          case "$EVENT_SCHEDULE" in
            "0 3 * * 1") VERSIONS="3.44" ;;
            "0 3 * * 2") VERSIONS="4.2" ;;
            *) VERSIONS="3.44 4.2" ;;
          esac
          if [ -f build/EmbeddingModel.npz ]; then
            MODEL=build/EmbeddingModel.npz
            MODEL_ARG="--model $MODEL"
          else
            MODEL=$(ls store/EmbeddingModel.*.npz)
            MODEL_ARG=""
          fi
          DATABASES=""
          for v in $VERSIONS; do
            u=${v%%.*}
            python pipeline/FetchCatalogue.py "$v" --output-dir build --connections 12
            python pipeline/BuildEmbeddings.py \
              --catalogue "build/plugins-$v.xml" \
              --readmes "build/plugins-$v" \
              --readme-urls "build/readme-urls-$v.json" \
              --model "$MODEL" \
              --universe "$u" \
              --output "build/Embeddings-$u.sqlite"
            DATABASES="$DATABASES --database $u=build/Embeddings-$u.sqlite"
          done
          python pipeline/StoreEmbeddings.py --store store $DATABASES $MODEL_ARG \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/embeddings"

      - name: Push the embeddings branch
        run: |
          cp pipeline/EmbeddingsBranchReadme.md store/README.md
          cd store
          # A single commit, force pushed: the branch never accumulates history.
          git init -q -b embeddings
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Embeddings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" embeddings
