name: Tests

on:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy pytest ruff
      - name: Lint
        run: ruff check SemanticPluginSearch pipeline tests tools
      - name: Run the suite (no QGIS required)
        run: python -m pytest -q
